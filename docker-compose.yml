services:

  # ────────────────────────────────────────────────────
  #  SETUP  — generate certs, set passwords, wait for ES
  # ────────────────────────────────────────────────────
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elk-setup
    user: "0"
    volumes:
      - ${CERTS_VOLUME}:/usr/share/elasticsearch/config/certs
    environment:
      - ELK_SERVER_PUBLIC_IP=${ELK_SERVER_PUBLIC_IP}
      - ELK_SERVER_DOMAIN=${ELK_SERVER_DOMAIN}
    command: >
      bash -c '
        if [ ! -f config/certs/ca.zip ]; then
          echo "==> Generating CA..."
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip
          unzip -q config/certs/ca.zip -d config/certs
        fi
        if [ ! -f config/certs/certs.zip ]; then
          echo "==> Generating node certificates..."

          # ── Build SAN lists dynamically ──────────────────────────────
          # Always include internal Docker names + localhost + 127.0.0.1
          # Append the public IP if set, and the domain name if set.
          PUBLIC_IP="${ELK_SERVER_PUBLIC_IP}"
          DOMAIN="${ELK_SERVER_DOMAIN}"

          EXTRA_IP=""
          EXTRA_DNS=""
          [ -n "$PUBLIC_IP" ] && [ "$PUBLIC_IP" != "YOUR_ELK_SERVER_IP" ] && [ "$PUBLIC_IP" != "YOUR_ELK_SERVER_IP_OR_HOSTNAME" ] && EXTRA_IP="\n      - $PUBLIC_IP"
          [ -n "$DOMAIN" ]    && [ "$DOMAIN" != "" ]                                                                               && EXTRA_DNS="\n      - $DOMAIN"

          printf "instances:\n  - name: elasticsearch\n    dns:\n      - elasticsearch\n      - localhost%s\n    ip:\n      - 127.0.0.1%s\n  - name: kibana\n    dns:\n      - kibana\n      - localhost%s\n    ip:\n      - 127.0.0.1%s\n  - name: fleet-server\n    dns:\n      - fleet-server\n      - localhost%s\n    ip:\n      - 127.0.0.1%s\n" \
            "$EXTRA_DNS" "$EXTRA_IP" \
            "$EXTRA_DNS" "$EXTRA_IP" \
            "$EXTRA_DNS" "$EXTRA_IP" \
            > config/certs/instances.yml

          echo "==> Certificate SANs:"
          cat config/certs/instances.yml

          bin/elasticsearch-certutil cert --silent --pem \
            --ca-cert config/certs/ca/ca.crt \
            --ca-key  config/certs/ca/ca.key \
            --in      config/certs/instances.yml \
            -out      config/certs/certs.zip
          unzip -q config/certs/certs.zip -d config/certs
        fi
        echo "==> Setting certificate permissions..."
        chown -R root:root config/certs
        find   config/certs -type d -exec chmod 750 {} \;
        find   config/certs -type f -exec chmod 640 {} \;
        echo "==> Waiting for Elasticsearch to be ready..."
        until curl -s --cacert config/certs/ca/ca.crt \
              https://elasticsearch:${ES_PORT} | grep -q "missing authentication credentials"; do
          sleep 5
        done
        echo "==> Setting kibana_system password..."
        curl -s -X POST \
          --cacert config/certs/ca/ca.crt \
          -u "elastic:${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" \
          https://elasticsearch:${ES_PORT}/_security/user/kibana_system/_password \
          -d "{\"password\":\"${KIBANA_SYSTEM_PASSWORD}\"}"
        echo ""
        echo "==> Setup complete!"
        # Sleep to ensure Docker Compose has time to poll the healthcheck before exit
        # This prevents the "container exited (0)" dependency error on subsequent runs.
        sleep 5
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/elasticsearch/elasticsearch.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  # ────────────────────────────────────────────────────
  #  ELASTICSEARCH
  # ────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: elasticsearch
    hostname: elasticsearch
    depends_on:
      setup:
        condition: service_healthy
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - ${CERTS_VOLUME}:/usr/share/elasticsearch/config/certs
      - ${ES_DATA_VOLUME}:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT}:9200"
      - "${ES_TRANSPORT_PORT}:9300"
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT}
          cpus: "${ES_CPU_LIMIT}"
    environment:
      # Cluster & node identity
      - cluster.name=${CLUSTER_NAME}
      - node.name=${ELASTICSEARCH_NODE_NAME}
      - discovery.type=single-node

      # Security
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate

      # Fleet / APM
      - xpack.security.authc.api_key.enabled=true

      # JVM heap
      - ES_JAVA_OPTS=-Xms${ES_JVM_HEAP} -Xmx${ES_JVM_HEAP}

      # Resource / index limits
      - cluster.max_shards_per_node=${ES_MAX_SHARDS_PER_NODE}
      - indices.recovery.max_bytes_per_sec=${ES_RECOVERY_MAX_BYTES_PER_SEC}
      - indices.fielddata.cache.size=${ES_INDICES_FIELDDATA_CACHE_SIZE}
      - indices.breaker.request.limit=${ES_CIRCUIT_BREAKER_REQUEST_LIMIT}
      - indices.breaker.total.limit=${ES_CIRCUIT_BREAKER_TOTAL_LIMIT}
      - indices.breaker.fielddata.limit=${ES_CIRCUIT_BREAKER_FIELDDATA_LIMIT}

      # Disk watermarks
      - cluster.routing.allocation.disk.watermark.low=${ES_WATERMARK_LOW}
      - cluster.routing.allocation.disk.watermark.high=${ES_WATERMARK_HIGH}
      - cluster.routing.allocation.disk.watermark.flood_stage=${ES_WATERMARK_FLOOD_STAGE}

      # Thread pools
      - thread_pool.write.queue_size=${ES_THREADPOOL_WRITE_QUEUE}
      - thread_pool.search.queue_size=${ES_THREADPOOL_SEARCH_QUEUE}

      # Bootstrap
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:${ES_PORT} | grep -q 'missing authentication credentials'"
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  # ────────────────────────────────────────────────────
  #  KIBANA
  # ────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    hostname: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    labels:
      co.elastic.logs/module: kibana
    volumes:
      - ${CERTS_VOLUME}:/usr/share/kibana/config/certs
      - ${KIBANA_DATA_VOLUME}:/usr/share/kibana/data
    ports:
      - "${KIBANA_PORT}:5601"
    deploy:
      resources:
        limits:
          memory: ${KIBANA_MEM_LIMIT}
          cpus: "${KIBANA_CPU_LIMIT}"
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://elasticsearch:${ES_PORT}
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=config/certs/kibana/kibana.crt
      - SERVER_SSL_KEY=config/certs/kibana/kibana.key
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_ENCRYPT_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - SERVER_MAXPAYLOAD=${KIBANA_MAX_PAYLOAD}
      - XPACK_FLEET_ENABLED=true
      - XPACK_FLEET_AGENTS_ELASTICSEARCH_HOSTS=["https://elasticsearch:${ES_PORT}"]
      - XPACK_FLEET_AGENTS_FLEET_SERVER_HOSTS=["https://fleet-server:${FLEET_SERVER_PORT}"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sk https://localhost:${KIBANA_PORT}/api/status | grep -q '\"overall\":{\"level\":\"available\"'"
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped


  # ────────────────────────────────────────────────────
  #  FLEET SERVER
  # ────────────────────────────────────────────────────
  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    container_name: fleet-server
    hostname: fleet-server
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ${CERTS_VOLUME}:/certs
      - ${FLEET_DATA_VOLUME}:/usr/share/elastic-agent/state
    ports:
      - "${FLEET_SERVER_PORT}:8220"
      - "${APM_SERVER_PORT}:8200"
    deploy:
      resources:
        limits:
          memory: ${FLEET_MEM_LIMIT}
          cpus: "${FLEET_CPU_LIMIT}"
    user: root
    environment:
      - FLEET_SERVER_ENABLE=true
      - FLEET_URL=https://fleet-server:${FLEET_SERVER_PORT}
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://elasticsearch:${ES_PORT}
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key
      - FLEET_SERVER_PORT=${FLEET_SERVER_PORT}
      - FLEET_SERVER_HOST=${FLEET_SERVER_HOST}
      - FLEET_SERVER_POLICY_ID=${FLEET_SERVER_POLICY}
      - KIBANA_HOST=https://kibana:${KIBANA_PORT}
      - KIBANA_CA=/certs/ca/ca.crt
      - KIBANA_USERNAME=elastic
      - KIBANA_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sk https://localhost:${FLEET_SERVER_PORT}/api/status | grep -q HEALTHY"
        ]
      interval: 15s
      timeout: 15s
      retries: 60
    restart: unless-stopped


volumes:
  esdata:
    driver: local
  kibanadata:
    driver: local
  fleetdata:
    driver: local
  certs:
    driver: local
